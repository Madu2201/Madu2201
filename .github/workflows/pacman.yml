name: generate animation

on:
  # Roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:
  
  # Roda a cada commit na branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera a animação do pacman a partir do gráfico de contribuições do usuário
      - name: generate pacman-contribution-graph.svg
        uses: maurodesouza/pacman-contribution-graph@release
        with:
          github_user_name: ${{ github.repository_owner }}

      # Envia os arquivos gerados para a branch pacman-output
      - name: push pacman-contribution-graph.svg to the pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
