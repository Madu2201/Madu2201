name: Update Streak Stats

on:
  schedule:
    # Roda automaticamente todo dia à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite rodar manualmente na aba Actions
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=Madu2201&theme=dracula&hide_border=false"
          path: "profile/streak-stats.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit e Push do SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak-stats.svg
          git commit -m "docs: atualiza streak stats" || exit 0
          git push
